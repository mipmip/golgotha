# HupHop sample configuration.
#
# Copy to ~/.config/huphop/config.yaml (or $XDG_CONFIG_HOME/huphop/config.yaml)
# and adjust. Validate with: hup config check
#
# Unknown keys are rejected (strict decoding), so stick to the keys below.

# Root under which all clones are created. `~` expands to your home dir.
base_dir: ~

# Default clone-path template (Go text/template). Per-provider override allowed.
# Fields: .BaseDir .Provider .Type .Short .Host .Owner .OwnerLower .Repo .RepoLower
clone_pattern_tpl: "{{.BaseDir}}/{{.Short}}.{{.OwnerLower}}/{{.Repo}}"

# Version control used to clone: git (default) or jj. jj uses
# `jj git clone --colocate` (keeps a real .git so sync still works). Overridable
# per provider and per repo (see vcs_rules below). Requires `jj` on PATH.
# clone_vcs: git

# How a bare TUI filter term is matched: "fuzzy" (subsequence, default) or
# "substring" (case-insensitive substring). The filter accepts fzf-style
# operators regardless: 'exact  ^prefix  suffix$  !negate  space=AND  a|b=OR.
# The "'" prefix always toggles a term to the opposite of this default.
# search_strategy: fuzzy

# TUI modes. Each mode sets its chrome (ordered `header`/`footer` element lists)
# and any mode settings. Omit `modes` entirely to use the built-in management
# mode (the standard layout). `default_mode` picks the mode when --mode is not
# given; --mode <name> overrides it.
# Placeable elements: breadcrumb, action_menu,
# filter, facet_status, status_message, position_indicator, switch_hint,
# clone_status. The repository list is always the body.
#
# default_mode: management
# modes:
#   management:
#     header: [breadcrumb]
#     footer: [filter, facet_status, status_message, position_indicator, action_menu]
#   multiplex:                 # a stripped-down mode for use inside tmux
#     header: []
#     footer: [switch_hint]
#     # switch_command is rendered per repo (clone-path fields plus {{.Target}},
#     # the local checkout path) then run without a shell. The multiplex primary
#     # action clones the repo if needed, then runs it.
#     switch_command: 'tmux-helper new-session -s "{{.Short}}->{{.OwnerLower}}" -c {{.Target}}'

providers:
  # Personal GitHub account (mipmip).
  - name: github-mipmip
    type: github
    short: gh
    # username: your own login on this provider (REQUIRED). It identifies your
    # own account: it is fetched via the authenticated-user endpoint (private
    # repos included) and behaves like an ordinary owner in the TUI (pinned
    # first, tinted).
    username: mipmip
    web_url: https://github.com
    # api_url: https://api.github.com   # default; override for GitHub Enterprise
    clone_protocol: ssh          # ssh | https
    # clone_vcs: jj              # per-provider override of the global clone_vcs
    # vcs_rules: per-repo clone-VCS overrides; first match wins. `match` is a
    # glob (path.Match) against "owner/name"; `vcs` is git or jj.
    # vcs_rules:
    #   - match: "mipmip/dotfiles"
    #     vcs: jj
    #   - match: "mipmip/*"
    #     vcs: jj
    auth:
      cli: gh                    # reuse the `gh` CLI token when available
      env: HUPHOP_GITHUB_TOKEN   # PAT fallback for headless/cron use
    # NOTE: leave `owners` unset to list YOUR OWN repositories (your `username`).
    # List `owners` to name organizations instead — each org entry is fetched via
    # /orgs/<owner>/repos.
    #
    # owners:
    #   - TechNative-B-V
    #
    # all_owners: discover every org you belong to automatically (plus your own
    # account, `username`) instead of naming each in `owners`. Default false.
    # `sync`/`refresh` eagerly fetch repos for every discovered owner; the TUI
    # lists owners immediately and fetches each on first entry. Any explicit
    # `owners` above are unioned in. Requires an org-read token scope (GitHub
    # read:org) or discovery finds nothing and huphop warns.
    #
    # all_owners: true
    #
    # exclude_owners: ignore specific owners by name (case-insensitive). To
    # exclude your own account, list your `username` here.
    #
    # exclude_owners:
    #   - noisy-org
    #   - mipmip
    # include_archived / include_forks control the cache SUPERSET: they decide
    # which repos are fetched and cached. The TUI's interactive facet filters
    # (f: fork, a: archived, v: visibility) only NARROW what is already cached —
    # they can hide cached repos but never reveal repos excluded here. Set these
    # to true if you want to be able to browse archived repos / forks in the TUI.
    include_archived: false      # default false
    include_forks: true          # default true
